name: "G: Firmware Native Tests"

on:
  push:
    branches:
      - main
    paths:
      - "firmware/**"
      - ".github/workflows/G-Build-Firmware-Native-Tests.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/G-Build-Firmware-Native-Tests.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  host-tests:
    name: Native unit tests (pio test -e native_test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-native-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-native-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run native test env
        working-directory: firmware
        run: pio test -e native_test
