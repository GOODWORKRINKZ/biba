; PlatformIO configuration for the BiBa STM32F103 firmware.
;
; The project follows a Betaflight/ELRS-style target layout: every
; supported hardware configuration lives under `targets/<TARGET>/` and
; is combined with every firmware mode (standalone / companion /
; combined) into an env named `<target_lowercase>_<mode>`.
;
; See firmware/README.md and firmware/targets/README.md
; for how to build, flash, and add new targets.

[platformio]
default_envs =
    rpico_rp2040_standalone

; --- Common --------------------------------------------------------------

[common]
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Wpedantic
    -Iinclude
    -Isrc
build_src_filter =
    +<*>
    -<hal/>
    -<drivers/>
    -<modes/>
    -<main.c>
    -<main_rp2040.cpp>
    -<poc/>
    -<app/telemetry.c>
    -<app/melody.c>
    -<app/adc_capture.c>
    -<app/blackbox.cpp>
    -<app/motor_bridge.c>
    +<drivers/crsf.c>

[env]
platform = ststm32
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[fw_common]
build_src_filter =
    +<*>
    -<hal/biba_hal_rp2040.c>
    -<hal/biba_hal_motor_rp2040.c>
    -<main_rp2040.cpp>
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Iinclude
    -Isrc
    -Isrc/proto
    -DHSE_VALUE=8000000

; --- Modes ---------------------------------------------------------------

[mode_standalone]
build_flags = -DBIBA_MODE_STANDALONE

[mode_companion]
build_flags = -DBIBA_MODE_COMPANION

[mode_combined]
build_flags = -DBIBA_MODE_COMBINED

; --- Targets -------------------------------------------------------------
;
; Each target stanza captures:
;   - `board`          PlatformIO board id
;   - `target_include` include path that contains `target.h` / `target_config.h`
;   - `build_flags`    -DBIBA_TARGET_<NAME> tag, useful in #if checks
;
; Env blocks further below glue `fw_common + <target> + <mode>` together.

[target_bluepill_f103c8]
board = bluepill_f103c8
target_include = targets/BLUEPILL_F103C8
build_flags = -DBIBA_TARGET_BLUEPILL_F103C8=1

[target_bluepill_f103c8_clone]
board = bluepill_f103c8
target_include = targets/BLUEPILL_F103C8_CLONE
build_flags = -DBIBA_TARGET_BLUEPILL_F103C8_CLONE=1

[target_biba_f103_rev_a]
board = genericSTM32F103C8
target_include = targets/BIBA_F103_REV_A
build_flags = -DBIBA_TARGET_BIBA_F103_REV_A=1

[target_rpico_rp2040]
board = pico
target_include = targets/RPICO_RP2040
build_flags = -DBIBA_TARGET_RPICO_RP2040=1

; --- Target: RPICO_RP2040_BLDC ----------------------------------------
;
; Mirror of RPICO_RP2040 for the BLDC/CAN variant. Same Pico board
; (pico), different pinout and target_config.h. See
; firmware/targets/RPICO_RP2040_BLDC/target.md and
; docs/adr/0001-pico-bldc-target.md for the architectural reasoning
; (Pico SDK bare-metal, HW SPI0 to MCP2515, ODrive CANSimple, no Kconfig).
;
; Switching to this target is "pio run -e rpico_rp2040_bldc_*" instead of
; "pio run -e rpico_rp2040_*" — no source-level toggle.

[target_rpico_rp2040_bldc]
board = pico
target_include = targets/RPICO_RP2040_BLDC
build_flags =
    -DBIBA_TARGET_RPICO_RP2040_BLDC=1
    -DBIBA_TARGET_HAS_BTS7960_2CH=0
    -DBIBA_TARGET_HAS_BLDC_2CH=1
    -DBIBA_TARGET_HAS_MCP2515=1

; --- Envs: BLUEPILL_F103C8 ----------------------------------------------

[env:bluepill_f103c8_standalone]
extends = env, fw_common
board = ${target_bluepill_f103c8.board}
build_flags =
    ${fw_common.build_flags}
    -I${target_bluepill_f103c8.target_include}
    ${target_bluepill_f103c8.build_flags}
    ${mode_standalone.build_flags}

[env:bluepill_f103c8_companion]
extends = env, fw_common
board = ${target_bluepill_f103c8.board}
build_flags =
    ${fw_common.build_flags}
    -I${target_bluepill_f103c8.target_include}
    ${target_bluepill_f103c8.build_flags}
    ${mode_companion.build_flags}

[env:bluepill_f103c8_combined]
extends = env, fw_common
board = ${target_bluepill_f103c8.board}
build_flags =
    ${fw_common.build_flags}
    -I${target_bluepill_f103c8.target_include}
    ${target_bluepill_f103c8.build_flags}
    ${mode_combined.build_flags}

; --- Envs: BLUEPILL_F103C8_CLONE ----------------------------------------
;
; Same pinout as BLUEPILL_F103C8, but the chip is a knock-off that
; reports as F103C8 yet only has 8 KB of RAM (the genuine die has
; 20 KB). Verified empirically by probing 0x20002000 OK / 0x20003000
; faults. The clone needs:
;   - linker script with LENGTH(RAM) = 8K so _estack stays inside the
;     real RAM (otherwise the first ISR push triggers HardFault),
;   - matching upload size cap so PlatformIO's RAM-usage report and
;     overflow check are sane.
; Pinout, peripheral map and motor topology are identical to the
; genuine bluepill, so we extend the same target stanza.
;
; Semihosting is enabled here too because this is the default debug
; target on the bench right now.

[clone_overrides]
board_upload.maximum_ram_size = 8192
board_build.ldscript = $PROJECT_DIR/ldscripts/stm32f103_8k_ram.ld
; OpenOCD must intercept BKPT 0xAB from biba_hal_debug.c and route the
; SYS_WRITE call through GDB File-I/O so printf() lands in the VS Code
; Debug Console instead of OpenOCD stdout (or worse, SIGTRAP).
debug_extra_cmds =
    monitor arm semihosting enable
    monitor arm semihosting_fileio enable

[env:bluepill_f103c8_clone_standalone]
extends = env, fw_common, clone_overrides
board = ${target_bluepill_f103c8_clone.board}
build_flags =
    ${fw_common.build_flags}
    -I${target_bluepill_f103c8_clone.target_include}
    ${target_bluepill_f103c8_clone.build_flags}
    ${mode_standalone.build_flags}

[env:bluepill_f103c8_clone_companion]
extends = env, fw_common, clone_overrides
board = ${target_bluepill_f103c8_clone.board}
build_flags =
    ${fw_common.build_flags}
    -I${target_bluepill_f103c8_clone.target_include}
    ${target_bluepill_f103c8_clone.build_flags}
    ${mode_companion.build_flags}

[env:bluepill_f103c8_clone_combined]
extends = env, fw_common, clone_overrides
board = ${target_bluepill_f103c8_clone.board}
build_flags =
    ${fw_common.build_flags}
    -I${target_bluepill_f103c8_clone.target_include}
    ${target_bluepill_f103c8_clone.build_flags}
    ${mode_combined.build_flags}

; --- Envs: BIBA_F103_REV_A ----------------------------------------------

[env:biba_f103_rev_a_standalone]
extends = env, fw_common
board = ${target_biba_f103_rev_a.board}
build_flags =
    ${fw_common.build_flags}
    -I${target_biba_f103_rev_a.target_include}
    ${target_biba_f103_rev_a.build_flags}
    ${mode_standalone.build_flags}

[env:biba_f103_rev_a_companion]
extends = env, fw_common
board = ${target_biba_f103_rev_a.board}
build_flags =
    ${fw_common.build_flags}
    -I${target_biba_f103_rev_a.target_include}
    ${target_biba_f103_rev_a.build_flags}
    ${mode_companion.build_flags}

[env:biba_f103_rev_a_combined]
extends = env, fw_common
board = ${target_biba_f103_rev_a.board}
build_flags =
    ${fw_common.build_flags}
    -I${target_biba_f103_rev_a.target_include}
    ${target_biba_f103_rev_a.build_flags}
    ${mode_combined.build_flags}

; --- Envs: RPICO_RP2040 ------------------------------------------------
;
; Uses the earlephilhower arduino-pico platform which exposes all
; pico-sdk headers to C source files while providing the Arduino
; setup/loop entry point (src/main_rp2040.cpp).
;
; STM32-specific HAL files are excluded; RP2040-specific ones are added.
; biba_hal_debug.c (semihosting) is excluded — printf goes to USB CDC
; via the arduino-pico framework automatically.

[rp2040_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    -<poc/>
    ; BLDC-only drivers (introduced by the RPICO_RP2040_BLDC target).
    ; Brushed targets stay on BTS7960 and have no MCP2515 / ODrive /
    ; CAN-bridge logic.
    -<drivers/mcp2515.c>
    -<drivers/can_queue.c>
    -<drivers/odrive_can.c>
    -<hal/biba_hal_motor_bldc.c>

[rp2040_poc_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    -<main_rp2040.cpp>
    -<modes/>
    -<app/>
    +<app/motor_bridge.c>
    +<app/adc_capture.c>
    +<poc/>
    -<poc/adc_capture.c>

[env:rpico_rp2040_standalone]
platform = raspberrypi
framework = arduino
board = ${target_rpico_rp2040.board}
upload_protocol = picotool
debug_tool = cmsis-dap
board_build.filesystem_size = 4MB
build_src_filter = ${rp2040_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rpico_rp2040.target_include}
    ${target_rpico_rp2040.build_flags}
    ${mode_standalone.build_flags}

[env:rpico_rp2040_companion]
platform = raspberrypi
framework = arduino
board = ${target_rpico_rp2040.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = ${rp2040_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rpico_rp2040.target_include}
    ${target_rpico_rp2040.build_flags}
    ${mode_companion.build_flags}

[env:rpico_rp2040_is_poc]
platform = raspberrypi
framework = arduino
board = ${target_rpico_rp2040.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = ${rp2040_poc_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rpico_rp2040.target_include}
    ${target_rpico_rp2040.build_flags}
    -DBIBA_IS_POC=1
    -DBIBA_MODE_STANDALONE

; --- Envs: RPICO_RP2040_BLDC ------------------------------------------
;
; BLDC variant of the RP2040 firmware stack. Same arduino-pico framework,
; different target headers / different src_filter. MCP2515 SPI driver and
; ODrive CAN driver take over from BTS7960 (see ADR-0001).
;
; Mode matrix:
;   - rpico_rp2040_bldc_standalone: same role as rpico_rp2040_standalone
;   - rpico_rp2040_bldc_companion:  SBC via USB-CDC (HW USB) — keeps the
;                                   same role but removes the SPI slave
;                                   link, which the BLDC pinout cannot
;                                   accommodate without conflict.
;   - rpico_rp2040_bldc_combined:   MODE_SEL jumper selects runtime mode.

[rp2040_bldc_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_motor_rp2040.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    -<poc/>
    ; BTS7960 brushed-DC driver excluded (BIBA_TARGET_HAS_BTS7960_2CH = 0
    ; on this target). Any caller from modes/app code is #if-guarded there.
    -<drivers/bts7960.c>
    ; The BLDC target has no native ADC channels, so voltage_sense
    ; (which references the undefined BIBA_ADS1115_CHAN_VBAT macro)
    ; and current_sense (which references BTS7960 IS-pin macros)
    ; cannot compile here.  No-op stubs in
    ; hal/biba_hal_motor_bldc.c take their place so the mode code
    ; does not need #if guards.
    -<drivers/voltage_sense.c>
    -<drivers/current_sense.c>
    ; BLDC backend modules added by sibling tasks t_a3ed6b73 and
    ; t_6c05e712. They are conditional via BIBA_HAS_* flags so that adding
    ; them here is safe even if the corresponding source files have not
    ; landed yet — build will simply skip them via src_filter.
    +<drivers/mcp2515.c>
    +<drivers/can_queue.c>
    +<drivers/odrive_can.c>
    +<hal/biba_hal_motor_bldc.c>

; --- CAN-loopback PoC for RPICO_RP2040_BLDC ----------------------------
;
; Same hardware as rpico_rp2040_bldc_standalone but uses
; src/poc/can_loopback_poc.cpp as the Arduino setup()/loop() entry.
; That PoC does NOT use the biba mode dispatcher — it is a minimal
; SPI↔MCP2515 self-test designed to be flashed first on a new board
; to verify the SPI wiring + MCP2515 configuration before plugging
; in any ODrive.  See docs/adr/0001-pico-bldc-target.md §5.

[rp2040_bldc_poc_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_motor_rp2040.c>
    -<hal/biba_hal_rp2040.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    -<main_rp2040.cpp>
    -<modes/>
    -<app/>
    ; BTS7960 brushed-DC driver excluded (BIBA_TARGET_HAS_BTS7960_2CH = 0).
    -<drivers/bts7960.c>
    ; Drivers that reference ADC / BTS7960 / voltage-channel macros
    ; not present on the BLDC target.  Their symbols are supplied as
    ; no-ops in hal/biba_hal_motor_bldc.c.
    -<drivers/voltage_sense.c>
    -<drivers/current_sense.c>
    -<drivers/ads1115.c>
    -<drivers/aht30.c>
    -<drivers/imu.c>
    -<drivers/crsf.c>
    ; PoC folder is excluded wholesale; only can_loopback_poc.cpp is
    ; kept (via the explicit -<...> override below).
    -<poc/>
    -<poc/is_rpm_poc_main.cpp>
    -<poc/adc_capture.c>
    -<poc/adc_capture.h>
    ; PoC-specific entry point added in place of main_rp2040.cpp.
    +<poc/can_loopback_poc.cpp>
    ; BLDC backend modules — needed by the PoC's TX/RX paths.
    +<drivers/mcp2515.c>
    +<drivers/can_queue.c>
    +<drivers/odrive_can.c>
    +<hal/biba_hal_motor_bldc.c>

[env:rpico_rp2040_bldc_can_loopback_poc]
platform = raspberrypi
framework = arduino
board = ${target_rpico_rp2040_bldc.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = ${rp2040_bldc_poc_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rpico_rp2040_bldc.target_include}
    ${target_rpico_rp2040_bldc.build_flags}
    -DBIBA_IS_POC=1
    -DBIBA_MODE_STANDALONE

[env:rpico_rp2040_bldc_standalone]
platform = raspberrypi
framework = arduino
board = ${target_rpico_rp2040_bldc.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = ${rp2040_bldc_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rpico_rp2040_bldc.target_include}
    ${target_rpico_rp2040_bldc.build_flags}
    ${mode_standalone.build_flags}

[env:rpico_rp2040_bldc_companion]
platform = raspberrypi
framework = arduino
board = ${target_rpico_rp2040_bldc.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = ${rp2040_bldc_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rpico_rp2040_bldc.target_include}
    ${target_rpico_rp2040_bldc.build_flags}
    ${mode_companion.build_flags}

[env:rpico_rp2040_bldc_combined]
platform = raspberrypi
framework = arduino
board = ${target_rpico_rp2040_bldc.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = ${rp2040_bldc_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rpico_rp2040_bldc.target_include}
    ${target_rpico_rp2040_bldc.build_flags}
    ${mode_combined.build_flags}

; --- Native host tests ---------------------------------------------------

[env:native_test]
platform = native
framework =
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.1
test_ignore = test_support
; Native env only compiles the portable (hardware-independent) modules.
; No target include path is needed because the portable code never
; touches target.h (it is guarded behind the hardware-specific code
; excluded by build_src_filter above).
build_src_filter = ${common.build_src_filter}
build_flags =
    ${common.build_flags}
    -Isrc/proto
    -Isrc/app
    -Isrc/drivers
    -Itest/test_support
    -DBIBA_NATIVE_TEST
    -lm
test_build_src = yes
