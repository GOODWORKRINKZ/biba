; --- Envs: RP2040_BRIDGE_PWM2CRSF -------------------------------------
;
; Builds only the bridge: shared CRSF encoder + src/pwm2crsf/.

[env:rp2040_bridge_pwm2crsf]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_bridge_pwm2crsf.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter =
    -<*>
    +<drivers/crsf.c>
    +<pwm2crsf/>
build_flags =
    -Isrc/drivers
    -Isrc/pwm2crsf
    -I${target_rp2040_bridge_pwm2crsf.target_include}
    ${target_rp2040_bridge_pwm2crsf.build_flags}

; --- Native host tests ---------------------------------------------------

[env:native_test]
platform = native
framework =
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.1
test_ignore = test_support
; Native env only compiles the portable (hardware-independent) modules.
; No target include path is needed because the portable code never
; touches target.h (it is guarded behind the hardware-specific code
; excluded by build_src_filter above).
build_src_filter = ${common.build_src_filter}
build_flags =
    ${common.build_flags}
    -Isrc/proto
    -Isrc/app
    -Isrc/drivers
    -Itest/test_support
    -DBIBA_NATIVE_TEST
    -lm
test_build_src = yes
