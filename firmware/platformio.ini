; PlatformIO configuration for the BiBa RP2040 firmware.
;
; The project follows a Betaflight/ELRS-style target layout: every
; supported hardware configuration lives under `targets/<TARGET>/` and
; is combined with every firmware mode (standalone / companion /
; combined) into an env named `<target_lowercase>_<mode>`.
;
; Target names follow <MCU>_<MOTOR>_<DRIVER>_<LINK> (ADR-0002):
;
;   RP2040_DC_BTS7960_PWM     brushed DC  + BTS7960 half-bridges, direct PWM
;   RP2040_BLDC_ODRIVE_CAN    BLDC        + ODrive,  MCP2515 SPI->CAN
;   RP2040_BLDC_ODRIVE_UART   BLDC        + ODrive,  ASCII on UART1
;   RP2040_BLDC_VESC_CAN      BLDC        + VESC,    MCP2515 SPI->CAN
;
; Boards that do not drive motors at all use <MCU>_BRIDGE_<FUNCTION>
; instead (RP2040_BRIDGE_PWM2CRSF).
;
; See firmware/README.md and firmware/targets/README.md
; for how to build, flash, and add new targets.

[platformio]
default_envs =
    rp2040_dc_bts7960_pwm_standalone

; --- Common --------------------------------------------------------------

[common]
build_flags =
    -std=gnu11
    -Wall
    -Wextra
    -Wpedantic
    -Iinclude
    -Isrc
build_src_filter =
    +<*>
    -<hal/>
    -<drivers/>
    -<modes/>
    -<main.c>
    -<main_rp2040.cpp>
    -<poc/>
    -<app/telemetry.c>
    -<app/melody.c>
    -<app/adc_capture.c>
    -<app/blackbox.cpp>
    -<app/motor_bridge.c>
    +<drivers/crsf.c>
    -<pwm2crsf/pwm2crsf_main.cpp>

; --- Modes ---------------------------------------------------------------

[mode_standalone]
build_flags = -DBIBA_MODE_STANDALONE

[mode_companion]
build_flags = -DBIBA_MODE_COMPANION

[mode_combined]
build_flags = -DBIBA_MODE_COMBINED

; --- Targets -------------------------------------------------------------
;
; Each target stanza captures:
;   - `board`          PlatformIO board id
;   - `target_include` include path that contains `target.h` / `target_config.h`
;   - `build_flags`    -DBIBA_TARGET_<NAME> tag, useful in #if checks
;
; Env blocks further below glue `<target> + <mode>` together.

[target_rp2040_dc_bts7960_pwm]
; `rpipico`, not `pico`: the two board ids select DIFFERENT frameworks
; from maxgerhardt's platform fork.  `pico` resolves to
; framework-arduino-mbed, which has no LittleFS.h and no pico-sdk PIO
; headers, so app/blackbox.cpp and hal/biba_hal_rp2040.c cannot build.
; `rpipico` is the earlephilhower board — the one the BLDC targets
; already use.
board = rpipico
target_include = targets/RP2040_DC_BTS7960_PWM
build_flags = -DBIBA_TARGET_RP2040_DC_BTS7960_PWM=1

; --- Target: RP2040_BLDC_ODRIVE_CAN -----------------------------------
;
; Mirror of RP2040_DC_BTS7960_PWM for the ODrive-over-CAN variant. Same
; Pico board, different pinout and target_config.h. See
; targets/RP2040_BLDC_ODRIVE_CAN/target.md and
; docs/adr/0001-pico-bldc-target.md for the architectural reasoning
; (Pico SDK bare-metal, HW SPI0 to MCP2515, ODrive CANSimple, no Kconfig).
;
; Switching to this target is "pio run -e rp2040_bldc_odrive_can_*"
; instead of "pio run -e rp2040_dc_bts7960_pwm_*" — no source-level toggle.

[target_rp2040_bldc_odrive_can]
board = rpipico
target_include = targets/RP2040_BLDC_ODRIVE_CAN
build_flags =
    -DBIBA_TARGET_RP2040_BLDC_ODRIVE_CAN=1
    -DBIBA_TARGET_HAS_BTS7960_2CH=0
    -DBIBA_TARGET_HAS_BLDC_2CH=1
    -DBIBA_TARGET_HAS_MCP2515=1
    -DBIBA_TARGET_BLDC_BACKEND_ODRIVE=1

; --- Target: RP2040_BLDC_ODRIVE_UART ----------------------------------
;
; The same ODrive pair driven over the ODrive ASCII protocol on UART1
; (GP4/GP5) instead of CAN.  A separate target rather than a build flag
; because the wiring genuinely differs: no MCP2515, no SPI0, and the
; capability flag BIBA_TARGET_HAS_MCP2515 flips to 0 (ADR-0002).
;
; This is the currently preferred production link — the CANSimple stack
; in ODrive fw 0.5.6 silently wedges at idle.

[target_rp2040_bldc_odrive_uart]
board = rpipico
target_include = targets/RP2040_BLDC_ODRIVE_UART
build_flags =
    -DBIBA_TARGET_RP2040_BLDC_ODRIVE_UART=1
    -DBIBA_TARGET_HAS_BTS7960_2CH=0
    -DBIBA_TARGET_HAS_BLDC_2CH=1
    -DBIBA_TARGET_HAS_MCP2515=0
    -DBIBA_TARGET_BLDC_BACKEND_ODRIVE=1

; --- Target: RP2040_BLDC_VESC_CAN -------------------------------------
;
; Flipsky dual FSESC (paired VESC) on the same MCP2515 SPI->CAN bridge
; as RP2040_BLDC_ODRIVE_CAN — electrically identical Pico wiring, a
; different bus dialect: 29-bit extended ids at 500 kbps, big-endian
; payloads, accept-all acceptance filters.  See
; targets/RP2040_BLDC_VESC_CAN/target.md and
; docs/adr/0002-target-naming-and-vesc.md.

[target_rp2040_bldc_vesc_can]
board = rpipico
target_include = targets/RP2040_BLDC_VESC_CAN
build_flags =
    -DBIBA_TARGET_RP2040_BLDC_VESC_CAN=1
    -DBIBA_TARGET_HAS_BTS7960_2CH=0
    -DBIBA_TARGET_HAS_BLDC_2CH=1
    -DBIBA_TARGET_HAS_MCP2515=1
    -DBIBA_TARGET_BLDC_BACKEND_VESC=1

; --- Target: RP2040_BRIDGE_PWM2CRSF -----------------------------------
;
; Not a BiBa controller: a separate Pico that converts 6 servo-PWM
; channels from a HotRC receiver into CRSF, so it can replace the ELRS
; receiver on BiBa's CRSF port. See targets/RP2040_BRIDGE_PWM2CRSF/target.md.

[target_rp2040_bridge_pwm2crsf]
board = rpipico
target_include = targets/RP2040_BRIDGE_PWM2CRSF
build_flags = -DBIBA_TARGET_RP2040_BRIDGE_PWM2CRSF=1

; --- Source filters ------------------------------------------------------
;
; One filter per drive backend.  They all start from `+<*>` and then
; remove what the target cannot compile, so a file added to src/ is
; picked up everywhere by default and has to be opted OUT — the safer
; direction for a shared tree.

[rp2040_dc_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    ; PWM→CRSF bridge is a separate device with its own setup()/loop()
    ; (env rp2040_bridge_pwm2crsf).
    -<pwm2crsf/>
    -<poc/>
    ; BLDC-only drivers.  Brushed targets stay on BTS7960 and have no
    ; MCP2515 / ODrive / VESC / CAN-bridge logic.
    -<drivers/mcp2515.c>
    -<drivers/can_queue.c>
    -<drivers/odrive_can.c>
    -<drivers/odrive_uart.c>
    -<drivers/vesc_can.c>
    -<hal/biba_hal_motor_bldc.c>

[rp2040_dc_poc_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    -<pwm2crsf/>
    -<main_rp2040.cpp>
    -<modes/>
    -<app/>
    ; BLDC-only drivers, same exclusions as [rp2040_dc_src_filter]. This
    ; is a brushed target: it has no MCP2515 / ODrive / VESC pin macros,
    ; and those TUs #error out unless their backend flag is set.
    -<drivers/mcp2515.c>
    -<drivers/can_queue.c>
    -<drivers/odrive_can.c>
    -<drivers/odrive_uart.c>
    -<drivers/vesc_can.c>
    -<hal/biba_hal_motor_bldc.c>
    +<app/motor_bridge.c>
    +<app/adc_capture.c>
    +<poc/>
    -<poc/adc_capture.c>
    ; CAN loopback PoC belongs to RP2040_BLDC_ODRIVE_CAN (it drives the
    ; MCP2515 pins this target does not define).
    -<poc/can_loopback_poc.cpp>

; Shared by every BLDC target: what they all drop relative to `+<*>`.
; The per-backend filters below repeat it because PlatformIO does not
; concatenate `build_src_filter` across sections.

[rp2040_bldc_odrive_can_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_motor_rp2040.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    -<pwm2crsf/>
    -<poc/>
    ; BTS7960 brushed-DC driver excluded (BIBA_TARGET_HAS_BTS7960_2CH = 0
    ; on this target). Any caller from modes/app code is #if-guarded there.
    -<drivers/bts7960.c>
    ; The BLDC targets have no native ADC channels, so voltage_sense
    ; (which references the undefined BIBA_ADS1115_CHAN_VBAT macro)
    ; and current_sense (which references BTS7960 IS-pin macros)
    ; cannot compile here.  No-op stubs in
    ; hal/biba_hal_motor_bldc.c take their place so the mode code
    ; does not need #if guards.
    -<drivers/voltage_sense.c>
    -<drivers/current_sense.c>
    ; Other backends of drivers/bldc.h — exactly one may be linked.
    -<drivers/odrive_uart.c>
    -<drivers/vesc_can.c>
    +<drivers/mcp2515.c>
    +<drivers/can_queue.c>
    +<drivers/odrive_can.c>
    +<hal/biba_hal_motor_bldc.c>

[rp2040_bldc_odrive_uart_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_motor_rp2040.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    -<pwm2crsf/>
    -<poc/>
    -<drivers/bts7960.c>
    -<drivers/voltage_sense.c>
    -<drivers/current_sense.c>
    ; No SPI→CAN bridge on this target: mcp2515.c dereferences
    ; BIBA_PIN_SPI0_* / BIBA_PIN_MCP2515_INT_GPIO, which
    ; targets/RP2040_BLDC_ODRIVE_UART/target.h deliberately does not
    ; define.  can_queue.c would be dead weight without it.
    -<drivers/mcp2515.c>
    -<drivers/can_queue.c>
    ; Other backends of drivers/bldc.h — exactly one may be linked.
    -<drivers/odrive_can.c>
    -<drivers/vesc_can.c>
    +<drivers/odrive_uart.c>
    +<hal/biba_hal_motor_bldc.c>

[rp2040_bldc_vesc_can_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_motor_rp2040.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    -<pwm2crsf/>
    -<poc/>
    -<drivers/bts7960.c>
    -<drivers/voltage_sense.c>
    -<drivers/current_sense.c>
    ; Other backends of drivers/bldc.h — exactly one may be linked.
    -<drivers/odrive_can.c>
    -<drivers/odrive_uart.c>
    +<drivers/mcp2515.c>
    +<drivers/can_queue.c>
    +<drivers/vesc_can.c>
    +<hal/biba_hal_motor_bldc.c>

; --- CAN-loopback PoC for RP2040_BLDC_ODRIVE_CAN -----------------------
;
; Same hardware as rp2040_bldc_odrive_can_standalone but uses
; src/poc/can_loopback_poc.cpp as the Arduino setup()/loop() entry.
; That PoC does NOT use the biba mode dispatcher — it is a minimal
; SPI↔MCP2515 self-test designed to be flashed first on a new board
; to verify the SPI wiring + MCP2515 configuration before plugging
; in any ODrive.  See docs/adr/0001-pico-bldc-target.md §5.
;
; It exercises the ODrive frame layout specifically (11-bit ids), so it
; is not shared with the VESC target; a VESC board can still be smoke
; tested with it by flashing this env, since the SPI half is identical.

[rp2040_bldc_odrive_can_poc_src_filter]
build_src_filter =
    +<*>
    -<hal/biba_hal.c>
    -<hal/biba_hal_motor.c>
    -<hal/biba_hal_motor_rp2040.c>
    -<hal/biba_hal_rp2040.c>
    -<hal/biba_hal_debug.c>
    -<main.c>
    -<pwm2crsf/>
    -<main_rp2040.cpp>
    -<modes/>
    -<app/>
    ; BTS7960 brushed-DC driver excluded (BIBA_TARGET_HAS_BTS7960_2CH = 0).
    -<drivers/bts7960.c>
    ; Drivers that reference ADC / BTS7960 / voltage-channel macros
    ; not present on the BLDC target.  Their symbols are supplied as
    ; no-ops in hal/biba_hal_motor_bldc.c.
    -<drivers/voltage_sense.c>
    -<drivers/current_sense.c>
    -<drivers/ads1115.c>
    -<drivers/aht30.c>
    -<drivers/imu.c>
    -<drivers/crsf.c>
    ; Other backends of drivers/bldc.h — exactly one may be linked.
    -<drivers/odrive_uart.c>
    -<drivers/vesc_can.c>
    ; PoC folder is excluded wholesale; only can_loopback_poc.cpp is
    ; kept (via the explicit +<...> override below).
    -<poc/>
    -<poc/is_rpm_poc_main.cpp>
    -<poc/adc_capture.c>
    -<poc/adc_capture.h>
    ; PoC-specific entry point added in place of main_rp2040.cpp.
    +<poc/can_loopback_poc.cpp>
    ; BLDC backend modules — needed by the PoC's TX/RX paths.
    +<drivers/mcp2515.c>
    +<drivers/can_queue.c>
    +<drivers/odrive_can.c>
    +<hal/biba_hal_motor_bldc.c>

; --- Envs: RP2040_DC_BTS7960_PWM ---------------------------------------
;
; Uses the earlephilhower arduino-pico platform which exposes all
; pico-sdk headers to C source files while providing the Arduino
; setup/loop entry point (src/main_rp2040.cpp).
;
; biba_hal_debug.c (semihosting) is excluded — printf goes to USB CDC
; via the arduino-pico framework automatically.

[env:rp2040_dc_bts7960_pwm_standalone]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_dc_bts7960_pwm.board}
upload_protocol = picotool
debug_tool = cmsis-dap
; 1 MB LittleFS out of the 2 MB the `rpipico` board declares, leaving
; ~1 MB for the sketch (current build uses ~140 KB).  The previous 4 MB
; did not fit any RP2040 board this project targets and made the env
; fail before compiling a single file.  A YD-RP2040 with 4/16 MB flash
; can take more — raise `board_upload.maximum_size` alongside it.
board_build.filesystem_size = 1MB
build_src_filter = ${rp2040_dc_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rp2040_dc_bts7960_pwm.target_include}
    ${target_rp2040_dc_bts7960_pwm.build_flags}
    ${mode_standalone.build_flags}
    -Wl,-u,_printf_float

[env:rp2040_dc_bts7960_pwm_companion]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_dc_bts7960_pwm.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = ${rp2040_dc_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rp2040_dc_bts7960_pwm.target_include}
    ${target_rp2040_dc_bts7960_pwm.build_flags}
    ${mode_companion.build_flags}
    -Wl,-u,_printf_float

[env:rp2040_dc_bts7960_pwm_is_poc]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_dc_bts7960_pwm.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = ${rp2040_dc_poc_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rp2040_dc_bts7960_pwm.target_include}
    ${target_rp2040_dc_bts7960_pwm.build_flags}
    -DBIBA_IS_POC=1
    -DBIBA_MODE_STANDALONE
    -Wl,-u,_printf_float

; --- Envs: RP2040_BLDC_ODRIVE_CAN -------------------------------------
;
; BLDC variant of the RP2040 firmware stack. Same arduino-pico framework,
; different target headers / different src_filter. MCP2515 SPI driver and
; ODrive CAN driver take over from BTS7960 (see ADR-0001).
;
; Mode matrix:
;   - *_standalone: same role as rp2040_dc_bts7960_pwm_standalone
;   - *_companion:  SBC via USB-CDC (HW USB) — keeps the same role but
;                   removes the SPI slave link, which the BLDC pinout
;                   cannot accommodate without conflict.
;   - *_combined:   MODE_SEL jumper selects runtime mode.

[env:rp2040_bldc_odrive_can_standalone]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_bldc_odrive_can.board}
upload_protocol = picotool
debug_tool = cmsis-dap
board_build.filesystem_size = 1MB
build_src_filter = ${rp2040_bldc_odrive_can_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rp2040_bldc_odrive_can.target_include}
    ${target_rp2040_bldc_odrive_can.build_flags}
    ${mode_standalone.build_flags}
    -Wl,-u,_printf_float

[env:rp2040_bldc_odrive_can_companion]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_bldc_odrive_can.board}
upload_protocol = picotool
debug_tool = cmsis-dap
board_build.filesystem_size = 1MB
build_src_filter = ${rp2040_bldc_odrive_can_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rp2040_bldc_odrive_can.target_include}
    ${target_rp2040_bldc_odrive_can.build_flags}
    ${mode_companion.build_flags}
    -Wl,-u,_printf_float

[env:rp2040_bldc_odrive_can_combined]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_bldc_odrive_can.board}
upload_protocol = picotool
debug_tool = cmsis-dap
board_build.filesystem_size = 1MB
build_src_filter = ${rp2040_bldc_odrive_can_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rp2040_bldc_odrive_can.target_include}
    ${target_rp2040_bldc_odrive_can.build_flags}
    ${mode_combined.build_flags}
    -Wl,-u,_printf_float

[env:rp2040_bldc_odrive_can_loopback_poc]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_bldc_odrive_can.board}
upload_protocol = picotool
debug_tool = cmsis-dap
build_src_filter = ${rp2040_bldc_odrive_can_poc_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rp2040_bldc_odrive_can.target_include}
    ${target_rp2040_bldc_odrive_can.build_flags}
    -DBIBA_IS_POC=1
    -DBIBA_MODE_STANDALONE
    -Wl,-u,_printf_float

