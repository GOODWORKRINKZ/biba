; --- Envs: RP2040_BLDC_VESC_CAN ---------------------------------------
;
; Flipsky dual FSESC on the same MCP2515 bridge as the ODrive CAN
; target.  drivers/vesc_can.c replaces drivers/odrive_can.c behind the
; shared drivers/bldc.h contract; the mode code is untouched.
;
; Before the first powered run, configure both FSESC halves in VESC
; Tool: distinct VESC IDs (0 / 1), CAN baud 500k, CAN status message
; mode CAN_STATUS_1_4_5.  See targets/RP2040_BLDC_VESC_CAN/target.md.

[env:rp2040_bldc_vesc_can_standalone]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_bldc_vesc_can.board}
upload_protocol = picotool
debug_tool = cmsis-dap
board_build.filesystem_size = 1MB
build_src_filter = ${rp2040_bldc_vesc_can_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rp2040_bldc_vesc_can.target_include}
    ${target_rp2040_bldc_vesc_can.build_flags}
    ${mode_standalone.build_flags}
    -Wl,-u,_printf_float

[env:rp2040_bldc_vesc_can_companion]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = ${target_rp2040_bldc_vesc_can.board}
upload_protocol = picotool
debug_tool = cmsis-dap
board_build.filesystem_size = 1MB
build_src_filter = ${rp2040_bldc_vesc_can_src_filter.build_src_filter}
build_flags =
    -Iinclude
    -Isrc
    -Isrc/proto
    -I${target_rp2040_bldc_vesc_can.target_include}
    ${target_rp2040_bldc_vesc_can.build_flags}
    ${mode_companion.build_flags}
    -Wl,-u,_printf_float

[env:rp2040_bldc_vesc_can_combined]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
